arena:
  x_min: -5.0
  x_max: 5.0
  y_min: -5.0
  y_max: 5.0
  boundary_margin: 0.10

boundary_walls:
  enabled: true
  thickness: 0.12
  height: 0.45

start:
  x: 0.0
  y: 0.0
  yaw: 0.0
  exclusion_radius: 0.65

goal:
  x: 3.0
  y: 0.0
  exclusion_radius: 0.60

start_goal_randomization:
  enabled: true
  minimum_distance: 4.5
  maximum_distance: 9.0
  boundary_clearance: 0.75
  start_yaw_mode: face_goal
  start_yaw_jitter_deg: 8.0
  max_sampling_attempts: 3000

robot:
  length: 0.47
  width: 0.48
  safety_margin: 0.08

planner:
  resolution: 0.08
  allow_diagonal: true

generation:
  inter_obstacle_gap: 0.12
  max_placement_attempts: 5000
  max_world_attempts: 1200

curriculum:
  enabled: true
  # Half staggered double blockers, one quarter single blockers and one
  # quarter clear paths to preserve efficient goal-directed behavior.
  scenario_cycle: [double_block, double_block, direct_block, clear]

difficulties:
  easy:
    obstacle_count: [3, 5]
    size_x: [0.30, 0.60]
    size_y: [0.30, 0.60]
    size_z: [0.30, 0.70]
    direct_block_probability: 0.0
    structured_blocker_size_x: [0.80, 1.00]
    structured_blocker_size_y: [0.80, 1.00]
    structured_blocker_fraction: [0.30, 0.50]
    structured_blocker_offset: 0.03
    double_blocker_size_x: [0.70, 0.90]
    double_blocker_size_y: [0.70, 0.90]
    double_blocker_fractions: [[0.24, 0.36], [0.62, 0.74]]
    double_blocker_offset: [0.12, 0.24]
    minimum_path_stretch: 1.08
  medium:
    obstacle_count: [6, 9]
    size_x: [0.30, 0.70]
    size_y: [0.30, 0.70]
    size_z: [0.30, 0.80]
    direct_block_probability: 0.0
    structured_blocker_size_x: [0.95, 1.20]
    structured_blocker_size_y: [0.95, 1.20]
    structured_blocker_fraction: [0.28, 0.52]
    structured_blocker_offset: 0.03
    double_blocker_size_x: [0.85, 1.10]
    double_blocker_size_y: [0.85, 1.10]
    double_blocker_fractions: [[0.23, 0.37], [0.61, 0.76]]
    double_blocker_offset: [0.16, 0.30]
    minimum_path_stretch: 1.12
  hard:
    obstacle_count: [10, 14]
    size_x: [0.35, 0.80]
    size_y: [0.35, 0.80]
    size_z: [0.35, 0.90]
    direct_block_probability: 0.0
    structured_blocker_size_x: [1.05, 1.35]
    structured_blocker_size_y: [1.05, 1.35]
    structured_blocker_fraction: [0.27, 0.53]
    structured_blocker_offset: 0.02
    double_blocker_size_x: [1.00, 1.25]
    double_blocker_size_y: [1.00, 1.25]
    double_blocker_fractions: [[0.22, 0.38], [0.60, 0.77]]
    double_blocker_offset: [0.20, 0.36]
    minimum_path_stretch: 1.16
