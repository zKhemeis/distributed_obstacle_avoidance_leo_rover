  n_sectors: 50
  linear_speed_max: 0.25
  angular_speed_max: 0.80
  maximum_goal_distance: 14.1421356237
  goal_tolerance: 0.25
  maximum_episode_steps: 400
  progress_weight: 5.0
  time_penalty: 0.01
  goal_reward: 50.0
  collision_penalty: 50.0
  timeout_penalty: 20.0
  safety_distance: 0.50
  proximity_penalty_weight: 0.25
